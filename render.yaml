services:
  - type: web
    name: pfa-dog-sterilization-api
    runtime: python
    rootDir: backend
    region: singapore
    # Plan choice:
    # - 'free': 512 MB RAM, sleeps after inactivity; run `flask --app run db upgrade` manually.
    # - 'starter': always-on, supports `preDeployCommand: flask --app run db upgrade`.
    plan: free
    # preDeployCommand: flask --app run db upgrade  # Paid plans ('starter' and above) only
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: PROXY_FIX_COUNT
        value: "1"
      - key: STORAGE_BACKEND
        value: r2
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"
      - key: R2_PRESIGNED_URL_EXPIRY
        value: "3600"
      - key: MAX_IMAGE_PIXELS
        value: "20000000"
      - key: MAX_PHOTOS_PER_DOG
        value: "15"
      - key: RATELIMIT_ENABLED
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: RATELIMIT_DEFAULT
        value: 200/minute
      - key: RATELIMIT_LOGIN_IP
        value: 5/minute
      - key: RATELIMIT_LOGIN_EMAIL
        value: 5/minute
      - key: RATELIMIT_PUBLIC_DOG
        value: 60/minute
      - key: RATELIMIT_PHOTO_UPLOAD
        value: 10/minute
      - key: RATELIMIT_EXPORT
        value: 10/minute
      - key: RATELIMIT_QR
        value: 30/minute
      - key: RATELIMIT_CHANGE_PASSWORD
        value: 5/minute
      - key: RATELIMIT_TOKEN_ROTATE
        value: 20/minute
      # Secret and environment-specific variables (enter values in Render Dashboard)
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: NGO_CONTACT_TEXT
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
